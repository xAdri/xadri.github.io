<!doctype html>
<html lang="ca-valencia">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Com de be el caic?</title>
    <style>
        :root {
            --bg1: #fff1f6;
            --bg2: #f7f0ff;
            --card: #ffffffcc;
            --stroke: #ffd4e3;
            --text: #3a2b3a;
            --muted: #6b5566;

            --btn: #ffffff;
            --btnStroke: #ffd4e3;
            --btnShadow: 0 10px 22px rgba(80, 20, 60, .10);

            --good: #ff5fa2;
            --goodSoft: rgba(255, 95, 162, .12);

            --radius: 26px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: ui-rounded, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            color: var(--text);
            background:
                radial-gradient(900px 600px at 20% 20%, #ffe1ef 0%, transparent 55%),
                radial-gradient(900px 600px at 80% 25%, #e9ddff 0%, transparent 55%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
            overflow: hidden;
        }

        .card {
            width: min(720px, 96vw);
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--stroke);
            box-shadow: 0 20px 60px rgba(60, 10, 40, .12);
            padding: clamp(18px, 3.2vw, 28px);
            backdrop-filter: blur(10px);
            position: relative;
        }

        h1 {
            margin: 0;
            font-size: clamp(22px, 3.2vw, 32px);
            line-height: 1.15;
            letter-spacing: .2px;
            text-align: center;
        }

        .arena {
            position: relative;
            height: clamp(230px, 44vh, 420px);
            border-radius: calc(var(--radius) - 10px);
            background: rgba(255, 255, 255, .55);
            border: 1px dashed rgba(255, 212, 227, .9);
            overflow: hidden;
        }

        .grid {
            position: absolute;
            inset: 0;
        }

        .btn {
            position: absolute;
            width: 54px;
            height: 54px;
            border-radius: 18px;
            border: 1px solid var(--btnStroke);
            background: var(--btn);
            box-shadow: var(--btnShadow);
            color: var(--text);
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;

            transform: translate(var(--x, 0px), var(--y, 0px)) scale(var(--s, 1));
            transition: transform 420ms cubic-bezier(.2, .9, .2, 1), filter 200ms ease;
            touch-action: manipulation;
        }

        .btn:hover {
            filter: brightness(1.03);
        }

        .btn:active {
            filter: brightness(.99);
        }

        .btn[data-n="8"] {
            border-color: rgba(255, 95, 162, .55);
            box-shadow: 0 14px 30px rgba(255, 95, 162, .14), 0 10px 22px rgba(80, 20, 60, .10);
            background: linear-gradient(180deg, #ffffff, #fff4f8);
            --s: 1.25;
            /* base del 8 */
        }

        .btn:focus-visible {
            outline: 3px solid rgba(255, 95, 162, .35);
            outline-offset: 3px;
        }

        /* Overlay final */
        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(.98);
            transition: opacity 240ms ease, transform 240ms ease;
        }

        .win .overlay {
            opacity: 1;
            transform: scale(1);
        }

        .finalCard {
            width: min(520px, 92%);
            border-radius: 22px;
            background: rgba(255, 255, 255, .78);
            border: 1px solid var(--stroke);
            box-shadow: 0 22px 70px rgba(60, 10, 40, .14);
            padding: 18px 16px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 6px 0 10px 0;
        }

        .eightWrap {
            width: 110px;
            height: 86px;
            border-radius: 20px;
            background: var(--goodSoft);
            border: 1px solid rgba(255, 95, 162, .40);
            display: grid;
            place-items: center;
            box-shadow: 0 18px 40px rgba(255, 95, 162, .10);
        }

        .eight {
            font-weight: 900;
            font-size: 64px;
            line-height: 1;
            transform-origin: 50% 52%;
            transform: rotate(0deg);
            transition: transform 640ms cubic-bezier(.2, 1, .2, 1);
            color: var(--good);
        }

        .heart {
            font-size: 44px;
            line-height: 1;
            opacity: 0;
            transform: scale(.6);
            transition: opacity 520ms ease, transform 520ms cubic-bezier(.2, 1, .2, 1);
        }

        .win .eight {
            transform: rotate(90deg);
        }

        /* 8 tombat = infinit */
        .win .heart {
            opacity: 1;
            transform: scale(1);
        }

        .finalText {
            margin: 0;
            color: rgba(58, 43, 58, .95);
            font-size: clamp(14px, 2vw, 18px);
            line-height: 1.35;
        }

        .footer {
            margin-top: 6px;
            color: rgba(107, 85, 102, .95);
            font-size: 13px;
        }

        @media (max-width: 520px) {
            .btn {
                width: 50px;
                height: 50px;
                border-radius: 16px;
            }

            .btn[data-n="8"] {
                --s: 1.18;
            }

            .arena {
                height: 52vh;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .btn,
            .overlay,
            .eight,
            .heart {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="card" id="card">
        <h1>Del 1 al 10… com de be el caic alba?</h1>
        <section class="arena" id="arena" aria-label="Botons del 1 al 10">
            <div class="grid" id="grid"></div>

            <div class="overlay" aria-live="polite">
                <div class="finalCard">
                    <div class="row" aria-hidden="true">
                        <div class="eightWrap">
                            <div class="eight">8</div>
                        </div>
                    </div>
                    <p class="finalText">jeje, un infinit eh puti</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const card = document.getElementById("card");
            const arena = document.getElementById("arena");
            const grid = document.getElementById("grid");

            const N = 10;
            const buttons = [];
            let locked = false;

            // CAMBIO: escala acumulativa para el 8 cuando fallas
            const baseScale8 = 1.25;    // escala inicial del 8
            const growStep8 = 0.12;     // cuanto crece por cada fallo
            const maxScale8 = 2.40;     // limite para que no se vaya de madre
            let extraScale8 = 0;        // crecimiento acumulado

            function clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            }

            function arenaSize() {
                const r = arena.getBoundingClientRect();
                return { w: r.width, h: r.height };
            }

            function randomPositionFor(el) {
                const { w, h } = arenaSize();
                const bw = el.offsetWidth || 54;
                const bh = el.offsetHeight || 54;
                const pad = 12;

                const x = Math.random() * (w - bw - pad * 2) + pad;
                const y = Math.random() * (h - bh - pad * 2) + pad;

                return { x, y };
            }

            function placeInitial() {
                const { w, h } = arenaSize();
                const topBand = h * 0.35;
                const botBand = h * 0.72;

                buttons.forEach((b, i) => {
                    const bw = b.el.offsetWidth || 54;
                    const col = i % 5;
                    const row = Math.floor(i / 5);

                    const baseX = (w / 5) * col + (w / 10) - (bw / 2);
                    const baseY = row === 0 ? topBand : botBand;

                    const jitterX = (Math.random() - 0.5) * 22;
                    const jitterY = (Math.random() - 0.5) * 16;

                    const x = clamp(baseX + jitterX, 10, w - bw - 10);
                    const y = clamp(baseY + jitterY, 10, h - bw - 10);

                    b.el.style.setProperty("--x", x + "px");
                    b.el.style.setProperty("--y", y + "px");
                });
            }

            function scatterAll() {
                buttons.forEach(b => {
                    const pos = randomPositionFor(b.el);
                    b.el.style.setProperty("--x", pos.x + "px");
                    b.el.style.setProperty("--y", pos.y + "px");
                });
            }

            // CAMBIO: aplicar el crecimiento acumulado al 8
            function updateScale8() {
                const btn8 = buttons.find(b => b.n === 8)?.el;
                if (!btn8) return;

                const s = clamp(baseScale8 + extraScale8, baseScale8, maxScale8);
                btn8.style.setProperty("--s", String(s));
            }

            function onPick(n) {
                if (locked) return;

                if (n !== 8) {
                    // CAMBIO: cada fallo hace crecer el 8
                    extraScale8 += growStep8;
                    updateScale8();

                    scatterAll();
                    return;
                }

                locked = true;
                card.classList.add("win");

                // deja el 8 bien grande al acertar
                const btn8 = buttons.find(b => b.n === 8)?.el;
                if (btn8) btn8.style.setProperty("--s", "1.85");
            }

            function build() {
                for (let i = 1; i <= N; i++) {
                    const el = document.createElement("button");
                    el.className = "btn";
                    el.type = "button";
                    el.textContent = String(i);
                    el.dataset.n = String(i);
                    el.setAttribute("aria-label", "Boto " + i);

                    el.addEventListener("click", () => onPick(i));

                    grid.appendChild(el);
                    buttons.push({ n: i, el });
                }

                requestAnimationFrame(() => {
                    placeInitial();
                    updateScale8(); // CAMBIO: asegura la escala inicial del 8
                });
            }

            let resizeTimer = null;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (!locked) placeInitial();
                }, 120);
            });

            build();
        })();
    </script>
</body>

</html>
